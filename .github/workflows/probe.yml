name: Probe Armory access
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Armory pages
        run: |
          python3 - <<'PY' > probe-result.txt
          import urllib.request, re, json
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36","Accept-Language":"en-US,en;q=0.9"}
          for u in ["https://worldofwarcraft.blizzard.com/en-us/forever/us/armory/character/gay-kitten",
                    "https://worldofwarcraft.blizzard.com/en-us/forever/us/armory/character/gay-kitten/reputation",
                    "https://worldofwarcraft.blizzard.com/en-us/forever/eu/armory/character/gingi-totemhugger",
                    "https://render.worldofwarcraft.com/forever-us/icons/56/spell_nature_starfall.jpg",
                    "https://foreverchanges.pro/items/sources.json"]:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30); b=r.read()
                  m=re.search(rb"var characterProfileInitialState = (\{.*?\});\s*\n",b,re.S)
                  extra=""
                  if m:
                      c=json.loads(m.group(1)).get("character",{}); extra=f" name={c.get('name')} level={c.get('level')}"
                  print(r.status,len(b),u,extra)
              except Exception as e:
                  print("ERR",u,repr(e)[:200])
          PY
          cat probe-result.txt
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-result.txt && git commit -m "Armory probe result" && git push
